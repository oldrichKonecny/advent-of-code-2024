[package]
name = "advent-of-code-2024"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
log = "0.4"
pretty_env_logger = "0.5"
reqwest = { version = "0.11", features = ["blocking"] }
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
rustc-hash = "2.1"

[profile.release]
debug = true
